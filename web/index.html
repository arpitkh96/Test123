<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilterTube</title>
<meta name="description" content="YouTube, filtered by rules you write in plain English.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f6e66'/%3E%3Cpath d='M3 4h10L9.5 8.5V12L6.5 10.5V8.5Z' fill='white'/%3E%3C/svg%3E">
<style>
/* Layout: sticky top bar (brand, YouTube search, view tabs); feed and search are card grids; watch is player + up-next column. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunk: #eceef2; --ink: #15191f; --muted: #5d6573; --line: #dde1e7;
  --accent: #0f6e66; --accent-ink: #ffffff; --accent-soft: #dcefec;
  --block: #b42318; --block-soft: #fde8e6; --boost: #7a5a00; --boost-soft: #fbf1d3;
  --font-display: "Manrope", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1215; --surface: #171b20; --sunk: #1f242a; --ink: #e6e9ee; --muted: #98a1ae; --line: #2a3038;
    --accent: #3cc3b4; --accent-ink: #062320; --accent-soft: #143430;
    --block: #ff8a7a; --block-soft: #3a1a17; --boost: #f0c75e; --boost-soft: #33290f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1600px; margin: 0 auto; }

.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.search { flex: 1 1 320px; min-width: 0; display: flex; max-width: 640px; }
.search input { flex: 1; min-width: 0; border: 1px solid var(--line); border-right: 0; background: var(--sunk); border-radius: 999px 0 0 999px; padding: 8px 16px; }
.search button { border: 1px solid var(--line); background: var(--surface); border-radius: 0 999px 999px 0; padding: 0 18px; font-weight: 600; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 7px 11px; border-radius: 999px; color: var(--muted); font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.count { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.tab[aria-current="page"] .count { background: var(--muted); color: var(--bg); }

.strip { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px; color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--accent); }
.dot.busy { background: var(--boost); animation: pulse 1s infinite alternate; }
.dot.err { background: var(--block); }
@keyframes pulse { to { opacity: .3 } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

main { padding-block: 4px 56px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 18px; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.thumb { position: relative; display: block; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--sunk); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.78); color: #fff; font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; }
.watched-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); }
.meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.title { font-weight: 600; font-size: 15px; line-height: 1.35; color: var(--ink); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.title:hover { text-decoration: underline; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.why { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pill.boost { background: var(--boost-soft); color: var(--boost); }
.pill.block { background: var(--block-soft); color: var(--block); }
.pill.allow { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.act:hover { color: var(--ink); border-color: var(--muted); }
a.act { text-decoration: none; }
.act[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* Watch */
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .watch { grid-template-columns: minmax(0, 1fr); } }
.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: var(--radius); overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.wtitle { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 14px 0 6px; text-wrap: balance; }
.wdesc { white-space: pre-wrap; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; max-height: 220px; overflow: auto; overflow-wrap: anywhere; }
.upnext { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.upnext h2 { font-size: 15px; }
.mini-card { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 10px; text-decoration: none; color: inherit; }
.mini-card .thumb { border-radius: 8px; }
.mini-card .title { font-size: 14px; }
.gate { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius); background: var(--surface); border: 1px dashed var(--line); display: grid; place-items: center; text-align: center; padding: 20px; }
.gate > div { display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Panels */
.col { max-width: 780px; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 17px; font-weight: 700; }
.lede { color: var(--muted); margin: 0; max-width: 64ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); padding: 12px 14px; line-height: 1.55; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-block; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.err { color: var(--block); }
.note.ok { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rulelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; padding: 12px 14px; border-radius: 8px; background: var(--sunk); }
.rule .pill { margin-top: 2px; text-transform: uppercase; }
.rule .txt { min-width: 0; }
.rule .cond { grid-column: 2; font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.rule.off { opacity: .55; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list .mini { width: 112px; flex: none; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: var(--sunk); }
.list .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { color: var(--ink); }
.addform { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
.addform input, .addform select, .field input, .field select { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
@media (max-width: 560px) { .addform { grid-template-columns: 1fr; } .mini-card { grid-template-columns: 128px minmax(0, 1fr); } }
code { font-family: var(--font-mono); font-size: 12px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Category chips on the feed */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 4px; scrollbar-width: thin; }
.chipbtn { flex: none; padding: 6px 14px; border-radius: 999px; background: var(--sunk); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid transparent; }
.chipbtn:hover { border-color: var(--line); }
.chipbtn[aria-current="true"] { background: var(--ink); color: var(--bg); }
.chipbtn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }

/* Sources page */
details.group { border-top: 1px solid var(--line); padding-top: 10px; }
details.group > summary { cursor: pointer; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.catsel { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 4px 6px; font-size: 12px; max-width: 46%; }
fieldset.sugg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
fieldset.sugg legend { font-weight: 700; padding: 0 4px; }
label.check { display: inline-flex; gap: 6px; align-items: center; }
@media (max-width: 560px) { .list li { flex-wrap: wrap; } .catsel { max-width: 100%; } }

/* Courses in a category */
.courses { margin-bottom: 24px; gap: 0; }
.courses h2 { margin-bottom: 6px; }
details.course { border-top: 1px solid var(--line); padding: 10px 0; }
details.course:first-of-type { border-top: 0; }
details.course > summary { cursor: pointer; display: flex; gap: 12px; align-items: center; list-style: none; }
details.course > summary::-webkit-details-marker { display: none; }
details.course > summary .grow { flex: 1; min-width: 0; }
.lectures { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 300px); gap: 14px; overflow-x: auto; padding: 12px 2px 6px; }
.lectures .mini-card { grid-template-columns: 1fr; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#feed" aria-label="FilterTube home">
      <span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 2h12L8.5 7.5V12L5.5 10.5V7.5Z" fill="var(--accent-ink)"/></svg></span>
      FilterTube
    </a>
    <form class="search" role="search" id="searchForm">
      <input id="q" type="search" placeholder="Search YouTube" aria-label="Search YouTube" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="#feed" data-view="feed">Feed</a>
      <a class="tab" href="#rules" data-view="rules">Rules <span class="count" id="nRules">0</span></a>
      <a class="tab" href="#sources" data-view="sources">Sources <span class="count" id="nSources">0</span></a>
      <a class="tab" href="#hidden" data-view="hidden">Hidden <span class="count" id="nHidden">0</span></a>
      <a class="tab" href="#settings" data-view="settings">Settings</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="strip" id="strip" aria-live="polite"></div>
  <main id="main"></main>
</div>
<noscript><p class="wrap">FilterTube needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
